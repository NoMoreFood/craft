# Optional /etc/gssproxy/80-craft.conf, root:root 0600. Replace the account, socket and source-cache path.
# The application account is explicitly authorized to use the issuer's tickets, but cannot read its home.
# Use one account/socket/source mapping per credential scope. Do not install an unedited example.
[service/craft-app]
    mechs = krb5
    euid = craft-app
    socket = /var/lib/gssproxy/craft-app.sock
    cred_usage = initiate
    cred_store = ccache:FILE:/var/lib/craft-users/alice/.krb5cc_craft
    cred_store = client_keytab:FILE:/dev/null
    cred_store = keytab:FILE:/dev/null
    trusted = no
    impersonate = no
    allow_protocol_transition = no
    allow_constrained_delegation = no
    allow_client_ccache_sync = no
    filter_flags = +DELEGATE
