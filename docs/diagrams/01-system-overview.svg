<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="01-system-overview-title 01-system-overview-desc">
  <title id="01-system-overview-title">Three Linux operating modes</title>
  <desc id="01-system-overview-desc">CRAFT checks the actual Linux caller's NSS home for user.pem and user.key. A complete pair uses mode 3's unprivileged acquisition path, including on privileged installations. Partial, unsafe or invalid inputs fail and retain the cache. If both files are absent, a setuid installation selects mode 1 enrollment or mode 2 credential linking from mechanism. All modes use PKINIT for the fixed caller principal, validate the KDC and returned TGT, then publish as the caller.</desc>
  <rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F6F9FB" stroke="none" stroke-width="1" />
  <rect x="0" y="0" width="1600" height="181" rx="0" fill="#112D43" stroke="none" stroke-width="1" />
  <rect x="64" y="40" width="5" height="26" rx="0" fill="#007F7C" stroke="none" stroke-width="1" />
  <text x="84" y="55.82" font-size="22" font-family="'Segoe UI', Arial, sans-serif" fill="#FFFFFF" font-weight="600" text-anchor="start">CRAFT</text>
  <text x="193" y="55.53" font-size="13" font-family="'Segoe UI', Arial, sans-serif" fill="#C2D7E4" font-weight="400" text-anchor="start">CERTIFICATE REQUEST AGENT FOR TICKETS</text>
  <text x="1536" y="55.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#C2D7E4" font-weight="400" text-anchor="end">01 / 06</text>
  <text x="64" y="114.78" font-size="38" font-family="'Segoe UI', Arial, sans-serif" fill="#FFFFFF" font-weight="600" text-anchor="start">Three Linux operating modes</text>
  <text x="64" y="153.58" font-size="18" font-family="'Segoe UI', Arial, sans-serif" fill="#C2D7E4" font-weight="400" text-anchor="start">A supplied PEM pair takes priority. Only an absent pair selects the configured privileged mechanism.</text>
  <rect x="64" y="220" width="350" height="125" rx="12" fill="#FFFFFF" stroke="#D5E0E7" stroke-width="1" />
  <rect x="84" y="241" width="4" height="23" rx="0" fill="#18334A" stroke="none" stroke-width="1" />
  <text x="100" y="258.63" font-size="23" font-family="'Segoe UI', Arial, sans-serif" fill="#18334A" font-weight="600" text-anchor="start">Invoke craft as the user</text>
  <text x="86" y="291.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">Real UID, NSS name and home</text>
  <text x="86" y="316.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">No arguments; no sudo</text>
  <rect x="480" y="220" width="736" height="125" rx="12" fill="#FFFFFF" stroke="#D5E0E7" stroke-width="1" />
  <rect x="500" y="241" width="4" height="23" rx="0" fill="#315DC0" stroke="none" stroke-width="1" />
  <text x="516" y="261.06" font-size="26" font-family="'Segoe UI', Arial, sans-serif" fill="#18334A" font-weight="600" text-anchor="start">Check user.pem and user.key in the NSS home</text>
  <text x="502" y="291.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">~/.config/craft/user.pem + user.key</text>
  <text x="502" y="316.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">Complete pair takes priority on every installation</text>
  <polyline points="414,282 480,282" fill="none" stroke="#18334A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="480,282 472.0,277.6 472.0,286.4" fill="#18334A" />
  <polyline points="670,345 670,428" fill="none" stroke="#007F7C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="670,428 674.4,420.0 665.6,420.0" fill="#007F7C" />
  <text x="695" y="390.39" font-size="19" font-family="'Segoe UI', Arial, sans-serif" fill="#007F7C" font-weight="600" text-anchor="start">BOTH FILES ABSENT</text>
  <rect x="190" y="428" width="736" height="87" rx="12" fill="#FFFFFF" stroke="#D5E0E7" stroke-width="1" />
  <rect x="210" y="449" width="4" height="23" rx="0" fill="#007F7C" stroke="none" stroke-width="1" />
  <text x="226" y="468.25" font-size="25" font-family="'Segoe UI', Arial, sans-serif" fill="#18334A" font-weight="600" text-anchor="start">Select the configured privileged mechanism</text>
  <text x="212" y="499.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">Requires setuid launcher, craft service account and /run/craft</text>
  <polyline points="1080,345 1080,392 1308,392 1308,560" fill="none" stroke="#315DC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
