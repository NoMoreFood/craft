  <text x="366" y="884.87" font-size="27" font-family="'Segoe UI', Arial, sans-serif" fill="#18334A" font-weight="600" text-anchor="start">Validate the user TGT and publish the cache as the caller</text>
  <text x="352" y="914.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">Fixed principal: Linux username @ realm; .krb5cc_craft mode 0600; select with KRB5CCNAME</text>
