  <text x="1102" y="433.39" font-size="19" font-family="'Segoe UI', Arial, sans-serif" fill="#315DC0" font-weight="600" text-anchor="start">COMPLETE PAIR</text>
  <text x="64" y="387.01" font-size="21" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">Partial, unsafe or invalid:</text>
  <text x="64" y="417.01" font-size="21" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">fail and retain cache.</text>
