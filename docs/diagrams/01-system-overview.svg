  <polygon points="799,560 803.4,552.0 794.6,552.0" fill="#7752A3" />
  <rect x="64" y="560" width="455" height="233" rx="12" fill="#E2F2EF" stroke="#D5E0E7" stroke-width="1" />
  <rect x="84" y="581" width="4" height="23" rx="0" fill="#007F7C" stroke="none" stroke-width="1" />
  <text x="100" y="601.06" font-size="26" font-family="'Segoe UI', Arial, sans-serif" fill="#18334A" font-weight="600" text-anchor="start">1  Privileged enrollment</text>
  <text x="86" y="631.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">mechanism=enrollment</text>
  <text x="86" y="656.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">Service account: GC + agent + CES</text>
  <text x="86" y="681.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">CA issues temporary user certificate</text>
  <text x="86" y="706.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">PKINIT authenticates that certificate</text>
  <text x="86" y="731.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">CA enforces recipient restrictions</text>
  <rect x="572" y="560" width="455" height="233" rx="12" fill="#FFFFFF" stroke="#D5E0E7" stroke-width="1" />
  <rect x="592" y="581" width="4" height="23" rx="0" fill="#7752A3" stroke="none" stroke-width="1" />
  <text x="608" y="598.63" font-size="23" font-family="'Segoe UI', Arial, sans-serif" fill="#18334A" font-weight="600" text-anchor="start">2  Privileged credential linking</text>
  <text x="594" y="631.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">mechanism=key_trust</text>
  <text x="594" y="656.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">Service account: writable DC + keytab</text>
  <text x="594" y="681.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">Add temporary msDS-KeyCredentialLink</text>
  <text x="594" y="706.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">Key Trust PKINIT; remove the entry</text>
  <text x="594" y="731.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">AD enforces attribute-write scope</text>
  <rect x="1080" y="560" width="455" height="233" rx="12" fill="#E3EBFA" stroke="#D5E0E7" stroke-width="1" />
  <rect x="1100" y="581" width="4" height="23" rx="0" fill="#315DC0" stroke="none" stroke-width="1" />
  <text x="1116" y="599.44" font-size="24" font-family="'Segoe UI', Arial, sans-serif" fill="#18334A" font-weight="600" text-anchor="start">3  Unprivileged Windows PEM</text>
  <text x="1102" y="631.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">Windows: user enrollment + export</text>
  <text x="1102" y="656.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">Securely transfer certificate and key</text>
  <text x="1102" y="681.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">Linux: caller validates and uses pair</text>
  <text x="1102" y="706.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">PKINIT uses KDC account mapping</text>
  <text x="1102" y="731.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#586F7F" font-weight="400" text-anchor="start">Supplied PEM files remain in place</text>
