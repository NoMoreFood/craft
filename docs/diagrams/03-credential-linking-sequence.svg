<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="03-credential-linking-sequence-title 03-credential-linking-sequence-desc">
  <title id="03-credential-linking-sequence-title">Mode 2  Privileged credential linking</title>
  <desc id="03-credential-linking-sequence-desc">With both home PEM files absent and mechanism=key_trust, the setuid launcher starts the worker as the dedicated service account. The service keytab authenticates a GSSAPI LDAP bind to the same writable DC used as the KDC. CRAFT resolves the user, generates an RSA-2048 key and local certificate identity, adds one Key Credential to msDS-KeyCredentialLink, and performs Key Trust PKINIT. The independent cleanup process removes that exact entry before validated TGT bytes return. Existing keys are preserved. Failed cleanup blocks publication and can require manual removal.</desc>
