<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="07-constrained-delegation-title 07-constrained-delegation-desc">
  <title id="07-constrained-delegation-title">Constrained Delegation</title>
  <desc id="07-constrained-delegation-desc">Service-only mode ignores home certificates. A private broker TGT authorizes S4U2Self, then S4U2Proxy for each configured same-realm SPN. All targets must succeed. Only final caller service tickets are published; maintenance refreshes the complete batch before its earliest expiry.</desc>
