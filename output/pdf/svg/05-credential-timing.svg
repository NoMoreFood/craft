  <text x="193" y="55.53" font-size="13" font-family="'Segoe UI', Arial, sans-serif" fill="#C2D7E4" font-weight="400" text-anchor="start">CERTIFICATE REQUEST AGENT FOR TICKETS</text>
  <text x="1536" y="55.77" font-size="17" font-family="'Segoe UI', Arial, sans-serif" fill="#C2D7E4" font-weight="400" text-anchor="end">05 / 06</text>
  <text x="64" y="114.78" font-size="38" font-family="'Segoe UI', Arial, sans-serif" fill="#FFFFFF" font-weight="600" text-anchor="start">Ticket clocks and certificate storage</text>
  <text x="64" y="153.58" font-size="18" font-family="'Segoe UI', Arial, sans-serif" fill="#C2D7E4" font-weight="400" text-anchor="start">All three modes request 10 h / 7 d by default. Certificate lifetime and KDC policy constrain the initial grant.</text>
