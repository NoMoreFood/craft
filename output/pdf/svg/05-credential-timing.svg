<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="05-credential-timing-title 05-credential-timing-desc">
  <title id="05-credential-timing-title">Ticket clocks and certificate storage</title>
  <desc id="05-credential-timing-desc">Home certificates and keys persist until the user replaces or removes them; ordinary certificate validity is accepted. Enrollment generates a temporary key and certificate, caps certificate validity at ten hours by default and releases its pair after PKINIT. All three modes request the same ten-hour TGT and seven-day renewal window. Renewal uses the cached ticket and session key. Fresh authentication near day six reuses a valid home pair, or uses the configured privileged mechanism if both files are absent. The renewed ticket's absolute renewal deadline remains fixed. Times are schedule illustrations.</desc>
