  <text x="1084" y="233.58" font-size="18" font-family="'Segoe UI', Arial, sans-serif" fill="#315DC0" font-weight="600" text-anchor="start">3 / WINDOWS-EXPORTED PEM</text>
  <text x="1084" y="262.2" font-size="20" font-family="'Segoe UI', Arial, sans-serif" fill="#18334A" font-weight="400" text-anchor="start">Persistent supplied certificate and key.</text>
