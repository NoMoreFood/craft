  <text x="584" y="262.2" font-size="20" font-family="'Segoe UI', Arial, sans-serif" fill="#18334A" font-weight="400" text-anchor="start">Temporary key and local identity.</text>
  <text x="584" y="288.2" font-size="20" font-family="'Segoe UI', Arial, sans-serif" fill="#18334A" font-weight="400" text-anchor="start">Remove directory entry after PKINIT.</text>
