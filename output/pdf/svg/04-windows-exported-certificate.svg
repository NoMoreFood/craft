<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="04-windows-exported-certificate-title 04-windows-exported-certificate-desc">
  <title id="04-windows-exported-certificate-title">Mode 3  Unprivileged Windows-exported certificate</title>
  <desc id="04-windows-exported-certificate-desc">The domain user runs the Windows certificate helper without elevation to enroll a certificate with an exportable software key. It exports user.pem and unencrypted user.key. Both files are transferred securely to the Linux user's fixed NSS-home .config/craft directory. Ordinary CRAFT executables run as the caller, validate files and the certificate against root-controlled CA trust and current CRLs, and perform PKINIT for Linux username at the configured realm. The KDC maps the certificate; CRAFT validates and publishes the TGT. The supplied pair persists and requires replacement before expiry. No Linux service account, keytab, LDAP or CES is needed.</desc>
