<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="01-system-overview-title 01-system-overview-desc">
  <title id="01-system-overview-title">A temporary certificate. A reusable ticket workflow.</title>
  <desc id="01-system-overview-desc">CRAFT separates the Linux caller, its dedicated enrollment worker, and the user ticket cache. The worker resolves the user in Active Directory, enrolls through CES and the CA, authenticates with PKINIT at the KDC, and publishes a caller-owned cache. Applications use that TGT to request service tickets and authenticate to services under the user's existing permissions.</desc>
