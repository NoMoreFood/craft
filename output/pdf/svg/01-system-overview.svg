<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="01-system-overview-title 01-system-overview-desc">
  <title id="01-system-overview-title">Two certificate paths to one user ticket cache</title>
  <desc id="01-system-overview-desc">The caller worker checks the NSS home for user.pem and user.key first. Home certificates are loaded, validated and used for PKINIT under the caller UID. No service account, directory lookup, enrollment agent or CES is used. If neither file exists, the setuid installation starts the dedicated service-account enrollment workflow, which resolves the directory UPN and enrolls through CES and the CA. Both paths request the fixed Linux-name Kerberos principal, validate the returned TGT and atomically publish a caller-owned cache. Applications use the cache for service tickets. Partial or invalid home pairs fail without enrollment fallback.</desc>
