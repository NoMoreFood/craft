  <text x="64" y="153.58" font-size="18" font-family="'Segoe UI', Arial, sans-serif" fill="#C2D7E4" font-weight="400" text-anchor="start">A ticket-granting ticket (TGT) lets approved Linux users request service tickets without storing AD passwords.</text>
