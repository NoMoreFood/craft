<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="02-enrollment-sequence-title 02-enrollment-sequence-desc">
  <title id="02-enrollment-sequence-title">Mode 1  Privileged certificate enrollment</title>
  <desc id="02-enrollment-sequence-desc">The setuid launcher starts the worker as the dedicated service account. A directory keytab authenticates the UPN lookup and CES Negotiate; separate mTLS may authenticate CES instead. CRAFT generates a fresh RSA-3072 key, signs an EOBO request with the enrollment-agent key, and obtains the restricted user certificate through CES and AD CS. It validates the certificate and performs PKINIT for the caller. Only validated TGT bytes return to the caller for atomic cache publication. Generated user credentials are temporary on Linux; CA issuance records remain.</desc>
