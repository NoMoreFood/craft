<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="02-enrollment-sequence-title 02-enrollment-sequence-desc">
  <title id="02-enrollment-sequence-title">From a Linux account to a validated user TGT.</title>
  <desc id="02-enrollment-sequence-desc">Sequence: validate the real caller and drop privileges; obtain a separate short-lived transport TGT using the submission keytab; resolve UPN and SID in the Global Catalog; generate and sign an EOBO request; enroll through CES; validate the certificate; perform user PKINIT; validate the TGT; return cache bytes to the unprivileged caller and publish atomically. Solid arrows are requests; dashed arrows are responses. CES transport uses Negotiate or a separate TLS client identity.</desc>
