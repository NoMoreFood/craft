  <text x="64" y="114.78" font-size="38" font-family="'Segoe UI', Arial, sans-serif" fill="#FFFFFF" font-weight="600" text-anchor="start">Home certificate PKINIT without privilege elevation</text>
  <text x="64" y="153.58" font-size="18" font-family="'Segoe UI', Arial, sans-serif" fill="#C2D7E4" font-weight="400" text-anchor="start">Ordinary executables run as the caller. The KDC maps the supplied certificate to the fixed Linux-name principal.</text>
