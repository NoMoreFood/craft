<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="05-home-certificate-workflow-title 05-home-certificate-workflow-desc">
  <title id="05-home-certificate-workflow-title">Home certificate PKINIT without privilege elevation</title>
  <desc id="05-home-certificate-workflow-desc">A caller-owned, complete PEM pair at the fixed NSS-home paths takes priority. All loading, certificate validation, PKINIT and cache publication run as the caller. Public root-controlled configuration, trust and current CRLs are readable by callers. No service account, enrollment keytab, LDAP, agent, CES or runtime issuance directory is needed. Files are opened once with ownership, permissions, regular-file, size and symlink checks. The certificate must pass key, logon usage, UPN shape, validity, trust and revocation checks. The KDC enforces account mapping, and CRAFT validates the exact returned TGT. Failure preserves the existing cache, while success atomically publishes it. Supplied PEM files remain and require user-managed replacement.</desc>
