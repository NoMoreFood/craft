  <text x="792" y="271.39" font-size="19" font-family="'Segoe UI', Arial, sans-serif" fill="#18334A" font-weight="400" text-anchor="start">Readable config, CA/KDC trust anchors and CRLs.</text>
  <text x="792" y="303.39" font-size="19" font-family="'Segoe UI', Arial, sans-serif" fill="#18334A" font-weight="400" text-anchor="start">No service account, keytab, LDAP, CES or /run/craft.</text>
